# /etc/filebeat/filebeat.yml on the Ubuntu Server (192.168.1.3)
filebeat.inputs:
  - type: log
    id: snort-log
    paths:
      - /var/log/snort/snort.log
    fields:
      source: snort
    fields_under_root: true

output.kafka:
  hosts: ["192.168.1.2:9092"]
  topic: "snort-alerts"
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000
  codec.format:
    string: '%{[message]}'
