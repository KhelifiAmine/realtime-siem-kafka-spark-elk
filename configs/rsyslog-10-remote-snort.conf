# /etc/rsyslog.d/10-remote-snort.conf on the Ubuntu Server (192.168.1.3)

# Listen for remote logs on UDP 514
module(load="imudp")
input(type="imudp" port="514")

# Optional: also listen on TCP 514 if you ever want it
module(load="imtcp")
input(type="imtcp" port="514")

# Log EVERYTHING coming from pfSense (192.168.1.1) into snort.log
*.*    /var/log/snort/snort.log
